<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PropVest – Real Estate Investment & Portfolio Management</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Tailwind CSS CDN with PropVest Design System Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#14213D',
              blue: '#2563EB',
              emerald: '#10B981',
              slate: '#1E293B',
              light: '#F8FAFC',
              darkBg: '#0B1120',
              darkCard: '#1E293B',
              darkBorder: '#334155'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#0B1120] text-[#1E293B] dark:text-[#F8FAFC] font-sans antialiased selection:bg-blue-600 selection:text-white transition-colors duration-200">
  <app-root></app-root>
</body>
</html>
